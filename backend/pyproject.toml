[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-commerce-backend"
version = "1.1.0"
description = "Phase 1.1 production foundation for Polaris Commerce Studio"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14.3,<4",
  "alembic>=1.16,<2",
  "cryptography>=46,<51",
  "boto3>=1.40,<2",
  "celery[redis]>=5.6,<6",
  "fastapi>=0.115,<1",
  "jsonschema==4.26.0",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy>=2.0,<3",
  "supertokens-python==0.31.3",
  "tencentcloud-sdk-python-sms==3.1.153",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.50,<2",
]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
norecursedirs = ["skill_sources"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["skill_sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

# The browser-backed domestic ecommerce adapters are intentionally isolated from
# the strict legacy backend typing gate while their Playwright protocols evolve.
[[tool.mypy.overrides]]
module = [
  "app.admin_account_routes",
  "app.admin_log_routes",
  "app.admin_usage_routes",
  "app.ecommerce_1688",
  "app.ecommerce_chrome",
  "app.ecommerce_crawl_tasks",
  "app.ecommerce_fetcher",
  "app.ecommerce_jd",
  "app.ecommerce_login",
  "app.ecommerce_pinduoduo",
  "app.ecommerce_routes",
  "app.ecommerce_session",
  "app.ecommerce_worker",
]
ignore_errors = true

# Frozen protocol archives are content-addressed historical task implementations.
# Keep their bytes stable; active providers remain under the strict typing gate.
[[tool.mypy.overrides]]
module = ["app.replica_exact_versions.*.replica_native_provider"]
disable_error_code = ["var-annotated"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["skill_manifests/*.json"]
